name: Release

# Every push to main that changes the app is tested, built, signed and published
# as a new release. Installed apps find it with "Check for updates", through
# update.json on the latest release.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

# One release at a time, in push order.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  NDK_VERSION: 28.2.13676358
  # SHA-256 of the release certificate. Every APK must carry exactly this
  # signature, or installed apps would refuse the update.
  RELEASE_CERT_SHA256: 9ffe27128b1895d7fd81cfd83150c3043a336622276fb5d88a3ee664208fc5ba

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  apk:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Major and minor come from pubspec.yaml; the patch number is the commit
      # count on main, so every release is newer than the last. The version
      # code (what the updater compares) is 100 plus that count.
      - name: Version
        id: version
        run: |
          base=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+)\..*/\1/p' app/pubspec.yaml)
          count=$(git rev-list --count HEAD)
          echo "name=$base.$count" >> "$GITHUB_OUTPUT"
          echo "code=$((100 + count))" >> "$GITHUB_OUTPUT"
          previous=$(git describe --tags --abbrev=0 2>/dev/null || true)
          delimiter="notes_$(openssl rand -hex 8)"
          {
            echo "notes<<$delimiter"
            git log --no-merges --format='- %s' "${previous:+$previous..}HEAD"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2

      - name: Android NDK and cargo-ndk
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Release key
        env:
          KEYSTORE: ${{ secrets.NEARVOLT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Add the NEARVOLT_* signing secrets to the repository first."
            exit 1
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/nearvolt.jks"
          echo "NEARVOLT_KEYSTORE=$RUNNER_TEMP/nearvolt.jks" >> "$GITHUB_ENV"

      - name: Build signed APKs
        working-directory: app
        env:
          NEARVOLT_KEYSTORE_PASSWORD: ${{ secrets.NEARVOLT_KEYSTORE_PASSWORD }}
          NEARVOLT_KEY_ALIAS: ${{ secrets.NEARVOLT_KEY_ALIAS }}
          NEARVOLT_KEY_PASSWORD: ${{ secrets.NEARVOLT_KEY_PASSWORD }}
        run: >-
          flutter build apk --release --split-per-abi
          --build-name ${{ steps.version.outputs.name }}
          --build-number ${{ steps.version.outputs.code }}

      - name: Verify signatures and package
        env:
          VERSION: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
          NOTES: ${{ steps.version.outputs.notes }}
        run: |
          rm -f "$RUNNER_TEMP/nearvolt.jks"
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          mkdir dist
          apks='{}'
          for abi in arm64-v8a armeabi-v7a x86_64; do
            file="nearvolt-$VERSION-$abi.apk"
            cp "app/build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/$file"
            if ! "$apksigner" verify --print-certs "dist/$file" | grep -q "SHA-256 digest: $RELEASE_CERT_SHA256"; then
              echo "::error::$file is not signed with the release key."
              exit 1
            fi
            sha=$(sha256sum "dist/$file" | cut -d' ' -f1)
            apks=$(jq -c --arg abi "$abi" --arg url "$base/$file" --arg sha "$sha" \
              '. + {($abi): {url: $url, sha256: $sha}}' <<< "$apks")
          done
          jq -n --arg version "$VERSION" --argjson code "$CODE" --arg notes "$NOTES" --argjson apks "$apks" \
            '{version: $version, code: $code, notes: $notes, apks: $apks}' > dist/update.json
          cat dist/update.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
          NOTES: ${{ steps.version.outputs.notes }}
        run: >-
          gh release create "v$VERSION" dist/*
          --target "$GITHUB_SHA"
          --title "Nearvolt $VERSION"
          --notes "$NOTES"
