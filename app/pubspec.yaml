name: nearvolt
description: "Move files directly between nearby devices at full speed."
publish_to: 'none'
# Releases keep major.minor from here; the release workflow sets the patch number
# and version code from the commit count on main.
version: 0.1.0+100

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  material_ui: ^1.1.0
  qr: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^30.0.4

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
